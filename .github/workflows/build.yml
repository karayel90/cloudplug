name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/*.jar || true

      # AGP 8.13.x requires JDK 17. Do not bump without bumping AGP.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      # NOT v3: the v3 default installs the removed "tools" SDK package
      # (android-actions issue #537) and its cmdline-tools URL 404s (#536).
      # v4 uses the maintained cmdline-tools path and node24.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # The source is checked out into ./src, so every path below is relative
      # to the workspace root and must point into it.
      - name: Verify provider categories
        working-directory: src
        run: bash ./scripts/verify-provider-categories.sh

      # The deliverable is built BEFORE the tests: a failing test must not
      # block publishing the .cs3 artifacts.
      - name: Build plugins
        working-directory: src
        run: |
          ./gradlew make makePluginsJson
          find . -maxdepth 3 -path "*/build/*.cs3" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"

      - name: Push builds
        working-directory: builds
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || echo "nothing to commit"
          git push --force origin HEAD:builds

      # Unit tests run last and are non-blocking. The Cloudstream library
      # snapshot that the tests compile against is fetched from a rolling
      # release, so a transient failure there must not stop the artifacts
      # from being published. Run them locally with:
      #   ./gradlew testReleaseUnitTest
      - name: Run unit tests
        working-directory: src
        continue-on-error: true
        run: ./gradlew testReleaseUnitTest
