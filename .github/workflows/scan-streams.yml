name: scan-streams

# Makine havuzunu 3 gunde bir tarar ve DirectStreams.kt icindeki calisan
# makine listesini yeniler. Liste degismedikce commit atilmaz.
on:
  schedule:
    - cron: '0 2 */3 * *'   # 3 gunde bir 02:00 UTC (yerel: 05:00)
  workflow_dispatch:         # elle tetikleme butonu

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Makine havuzunu tara
        shell: pwsh
        run: ./tools/scan-streams.ps1

      - name: Fark varsa commit at
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TabiiProvider/src/main/kotlin/tr/tabii/DirectStreams.kt
          if (git diff --cached --quiet) {
            Write-Host "Fark yok; liste zaten guncel."
          } else {
            git commit -m "scan: makine listesi guncellendi [skip ci]"
            git push
          }
